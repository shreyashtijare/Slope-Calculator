<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Slope Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">

  <header>
    <h1>Slope Calculator</h1>
    <p>Calculate slope, distance, or elevation — with conversions</p>
  </header>

  <!-- Calculator -->
  <section class="card">
    <h2>Calculator</h2>

    <label>Higher Elevation (HE)</label>
    <input type="number" id="he" placeholder="e.g. 120.5">

    <label>Lower Elevation (LE)</label>
    <input type="number" id="le" placeholder="e.g. 100">

    <label>Horizontal Distance</label>
    <input type="number" id="distance" placeholder="e.g. 40">

    <label>Slope (%)</label>
    <input type="number" id="slope" placeholder="e.g. 50">

    <button id="calculateBtn">Calculate</button>
    <button id="resetBtn" class="secondary">Reset</button>

    <div id="result" class="result"></div>
  </section>

  <!-- Conversion -->
  <section class="card">
    <h2>Slope Conversion</h2>

    <label>Percent (%)</label>
    <input type="number" id="convPercent" placeholder="50">

    <label>Ratio (rise : run)</label>
    <div class="ratio">
      <input type="number" id="ratioRise" placeholder="1">
      <span>:</span>
      <input type="number" id="ratioRun" placeholder="2">
    </div>

    <label>Angle (degrees)</label>
    <input type="number" id="convAngle" placeholder="26.565">

    <button id="convertBtn">Convert</button>

    <div id="convResult" class="result"></div>
  </section>

</div>

<script src="script.js"></script>
</body>
</html>
