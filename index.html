<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Slope Calculator + Google Maps</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css">

  <!-- Google Maps JS API (PUT YOUR KEY) -->
  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_API_KEY&libraries=drawing"></script>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <h2>Tools</h2>
  <ul>
    <li><a href="#" data-panel="slopePanel">Slope Calculator</a></li>
    <li><a href="#" data-panel="mapPanel">Maps Tool</a></li>
  </ul>
</div>

<!-- Toggle -->
<button class="sidebar-toggle" id="sidebarToggle">☰</button>

<!-- Panels -->
<div class="panel slope-panel" id="slopePanel">
  <div class="card">
    <h1>Slope Calculator</h1>

    <label>Higher Elevation</label>
    <input id="he" type="number">

    <label>Lower Elevation</label>
    <input id="le" type="number">

    <label>Distance</label>
    <input id="distance" type="number">

    <label>Slope (%)</label>
    <input id="slope" type="number">

    <button id="calculateBtn">Calculate</button>
    <div id="result"></div>
  </div>
</div>

<!-- FULLSCREEN MAP -->
<div class="panel map-panel" id="mapPanel">
  <div id="map"></div>

  <!-- Floating controls -->
  <div class="map-ui">
    <button id="clearShapes">Clear</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
