<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Engineering Tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <h2>Tools</h2>
  <ul>
    <li><a href="#" data-panel="slopePanel">Slope Calculator</a></li>
    <li><a href="#" data-panel="placeholderPanel">Maps Tool</a></li>
  </ul>
</div>

<!-- Sidebar toggle -->
<button class="sidebar-toggle" id="sidebarToggle">☰</button>

<!-- Panels -->

<!-- Slope Calculator Panel -->
<div class="panel active" id="slopePanel">
  <div class="app">

    <header>
      <h1>Slope Calculator</h1>
      <p>Calculate slope, distance, or elevation</p>
    </header>

    <!-- Calculator -->
    <section class="card">
      <h2>Calculator</h2>

      <label>Higher Elevation (HE)</label>
      <input type="number" id="he">

      <label>Lower Elevation (LE)</label>
      <input type="number" id="le">

      <label>Horizontal Distance</label>
      <input type="number" id="distance">

      <label>Slope (%)</label>
      <input type="number" id="slope">

      <button id="calculateBtn">Calculate</button>
      <button id="resetBtn" class="secondary">Reset</button>

      <div id="result" class="result"></div>
    </section>

    <!-- Conversion -->
    <section class="card">
      <h2>Slope Conversion</h2>

      <label>Percent (%)</label>
      <input type="number" id="convPercent">

      <label>Ratio (rise : run)</label>
      <div class="ratio">
        <input type="number" id="ratioRise">
        <span>:</span>
        <input type="number" id="ratioRun">
      </div>

      <label>Angle (degrees)</label>
      <input type="number" id="convAngle">

      <button id="convertBtn">Convert</button>

      <div id="convResult" class="result"></div>
    </section>

  </div>
</div>

<!-- Placeholder Panel -->
<div class="panel" id="placeholderPanel">
  <div class="placeholder">
    <h1>Maps Tool</h1>
    <p>Coming next 🚀</p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
